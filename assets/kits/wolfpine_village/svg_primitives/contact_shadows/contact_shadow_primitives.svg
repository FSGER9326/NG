    <g id="contact_shadow_oval_soft_v1">
      <ellipse cx="128" cy="220" rx="84" ry="18" fill="url(#contact_shadow_soft_grad_v1)"/>
    </g>
    <g id="contact_shadow_wall_foot_v1">
      <rect x="12" y="214" width="232" height="18" rx="8" fill="#000" opacity="0.18"/>
    </g>
    <g id="contact_shadow_post_pair_v1">

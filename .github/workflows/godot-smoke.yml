name: Godot smoke and scenario test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  godot-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Godot
        run: |
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64

      - name: Run headless scene smoke test
        run: ./Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tools/godot_smoke_test.gd

      - name: Run scripted Wolfpine scenario
        run: |
          mkdir -p debug/latest
          NG_DEBUG_DIR="$PWD/debug/latest" ./Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tools/run_scenario_test.gd --scenario res://tests/scenarios/wolfpine_missing_caravan.json

      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NG-godot-debug-logs
          path: debug/latest/

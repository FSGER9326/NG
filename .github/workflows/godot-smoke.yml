name: Godot smoke and scenario test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  godot-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Godot
        run: |
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64

      - name: Run headless scene smoke test
        run: ./Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tools/godot_smoke_test.gd

      - name: Run scripted scenarios
        run: |
          mkdir -p debug/latest
          for scenario in tests/scenarios/*.json; do
            echo "===== Scenario: ${scenario} =====" | tee -a debug/latest/scenario.log
            NG_DEBUG_DIR="$PWD/debug/latest" ./Godot_v4.3-stable_linux.x86_64 --headless --path . --script res://tools/run_scenario_test.gd --scenario "res://${scenario}" 2>&1 | tee -a debug/latest/scenario.log
          done

      - name: Upload debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NG-godot-debug-logs
          path: debug/latest/

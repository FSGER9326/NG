name: Validate NG data

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate JSON project data
        run: python tools/validate_project.py

      - name: Validate area routes
        run: python tools/validate_area_routes.py

      - name: Validate character creation data
        run: python tools/validate_character_creation.py

      - name: Validate portrait metadata
        run: python tools/validate_portraits.py

      - name: Validate quest seed bank
        run: python tools/validate_quest_seeds.py

      - name: Validate GDScript helper contracts
        run: python tools/validate_gdscript_helpers.py

      - name: Validate Issue 13 portrait patcher
        run: python tools/validate_issue_13_patcher.py

      - name: Validate asset kit manifests
        run: python tools/validate_asset_kits.py

      - name: Validate promoted asset files
        run: python tools/validate_promoted_asset_files.py

      - name: Validate asset production batch manifests
        run: python tools/validate_asset_production_batches.py

      - name: Validate asset promotion plans
        run: python tools/validate_asset_promotion_plans.py

      - name: Validate asset review gates
        run: python tools/validate_asset_reviews.py

      - name: Validate asset review outcomes
        run: python tools/validate_asset_review_outcomes.py

      - name: Validate Wolfpine pipeline scorecards
        run: python tools/validate_wolfpine_pipeline.py wolfpine_village_batch_00 wolfpine_village_batch_01

      - name: Test Wolfpine pipeline validators
        run: python tools/test_wolfpine_pipeline_validators.py

      - name: Test asset promotion dry run
        run: python tools/test_promote_asset_candidates.py

  pr-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: List changed files
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" > changed_files.txt
            git diff --name-status "origin/$GITHUB_BASE_REF...HEAD" > changed_files_name_status.txt
          else
            git diff --name-only HEAD~1...HEAD > changed_files.txt || true
            git diff --name-status HEAD~1...HEAD > changed_files_name_status.txt || true
          fi
          cat changed_files.txt

      - name: Check PR scope hygiene
        run: python tools/check_pr_hygiene.py changed_files.txt

      - name: Check reference asset layout hygiene
        run: python tools/validate_reference_asset_layout.py changed_files_name_status.txt

      - name: Audit existing reference asset layout debt
        run: python tools/validate_reference_asset_layout.py --audit-repo
